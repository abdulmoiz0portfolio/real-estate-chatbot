<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropertyAI - Autonomous Real Estate Concierge | Automatixes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen h-[100dvh] overflow-hidden flex flex-col font-['Plus_Jakarta_Sans',sans-serif]">

  <!-- Sleek Luxury Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md shrink-0 h-16 z-50">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-building-user text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg leading-tight bg-gradient-to-r from-white via-slate-100 to-emerald-400 bg-clip-text text-transparent">PropertyAI Concierge</h1>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider">v2.4 Live</span>
          </div>
          <p class="text-[11px] text-emerald-400 font-medium flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Autonomous Real Estate Advisor • Automatixes Engine
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-bolt text-emerald-400 text-[10px]"></i>
          <span>Sub-60s SLA</span>
        </span>
        <button id="btn-clear-chat" onclick="resetChat()" title="Reset Conversation" class="px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-rose-500/20 hover:border-rose-500/40 hover:text-rose-400 text-slate-300 text-xs transition-all flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-rotate-right"></i>
          <span class="hidden sm:inline text-[11px] font-medium">Reset Chat</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Focused Pure Chat Layout with Pinned Bottom Input -->
  <main class="flex-1 min-h-0 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col overflow-hidden">
    <div class="flex-1 min-h-0 flex flex-col glass-panel rounded-2xl border border-slate-800/80 bg-slate-900/50 overflow-hidden shadow-2xl relative">
      
      <!-- Messages Area: Only this scrolls -->
      <div id="chat-messages" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Suggested Quick Actions Bar (Pinned) -->
      <div class="shrink-0 px-4 py-2 bg-slate-950/80 border-t border-slate-800/60 z-20">
        <div class="flex items-center gap-1.5 mb-2 text-[11px] font-semibold text-slate-400">
          <i class="fa-solid fa-sparkles text-amber-400"></i>
          <span>Quick Inquiries:</span>
        </div>
        <div class="overflow-x-auto whitespace-nowrap flex gap-2 pb-1 custom-scrollbar">
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="I want to buy a luxury 3 to 4-bedroom single family home.">
            <i class="fa-solid fa-house-chimney text-emerald-400"></i>
            Buy Luxury Home
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="I'd like to schedule a private VIP property showing.">
            <i class="fa-solid fa-calendar-check text-blue-400"></i>
            Schedule Private Tour
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Show me high-yield multi-family and commercial investment properties.">
            <i class="fa-solid fa-chart-line text-purple-400"></i>
            High-Yield Investments
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="What are current mortgage interest rates and financing options?">
            <i class="fa-solid fa-calculator text-amber-400"></i>
            Financing & Pre-Approval
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="I am looking to sell or list my property for maximum valuation.">
            <i class="fa-solid fa-tag text-teal-400"></i>
            Sell / List Property
          </button>
        </div>
      </div>

      <!-- Chat Input Bar (Pinned permanently to bottom) -->
      <div class="shrink-0 p-3 sm:p-4 bg-slate-900/95 border-t border-slate-800/80 z-20">
        <form id="chat-form" class="flex items-center gap-2">
          <div class="relative flex-1">
            <input 
              type="text" 
              id="chat-input" 
              placeholder="Type your property inquiry or requirement..."
              class="w-full bg-slate-950/90 border border-slate-700/90 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 shadow-inner"
              autocomplete="off"
            >
          </div>
          <button 
            type="submit" 
            id="btn-send"
            class="px-5 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-semibold text-sm shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2 shrink-0 cursor-pointer disabled:opacity-50"
          >
            <span>Send</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
        <div class="mt-2 flex items-center justify-between text-[11px] text-slate-500 px-1">
          <span>100% Autonomous Concierge • Instant SMS & Email Dispatch</span>
          <span>Press Enter ↵ to send</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Silent Background Dispatch Form (Sends to bobrober2323@gmail.com via FormSubmit token) -->
  <form id="lead-dispatch-form" action="https://formsubmit.co/261b110198af097aa708b5e5cccb5c64" method="POST" target="lead_sink_iframe" style="display:none;">
    <input type="hidden" name="_subject" id="lead-form-subject" value="New Real Estate Lead">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="Client_Name" id="lead-form-name">
    <input type="hidden" name="Phone_Number" id="lead-form-phone">
    <input type="hidden" name="Email_Address" id="lead-form-email">
    <input type="hidden" name="Property_Interest" id="lead-form-intent">
    <input type="hidden" name="Target_Area" id="lead-form-location">
    <input type="hidden" name="Budget" id="lead-form-budget">
    <input type="hidden" name="Timeline" id="lead-form-timeline">
    <input type="hidden" name="Lead_Summary" id="lead-form-summary">
  </form>
  <iframe name="lead_sink_iframe" id="lead_sink_iframe" style="display:none;width:0;height:0;border:none;"></iframe>

  <script src="app.js?v=3.4"></script>
</body>
</html>
