<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropertyBot - Pakistan Real Estate AI Assistant</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-['Plus_Jakarta_Sans',sans-serif]">

  <!-- Sleek Minimal Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-house-chimney-user text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">PropertyBot</h1>
          <p class="text-[11px] text-emerald-400 font-medium flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Pakistan Real Estate AI Active
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-circle-check text-emerald-400 text-[10px]"></i>
          <span>Online</span>
        </span>
        <button id="btn-clear-chat" title="Clear Chat History" class="p-2 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-rose-500/20 hover:border-rose-500/40 hover:text-rose-400 text-slate-300 text-xs transition-all">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Focused Pure Chat Layout -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col h-[calc(100vh-4rem)]">
    <div class="flex-1 flex flex-col glass-panel rounded-2xl border border-slate-800/80 bg-slate-900/50 overflow-hidden shadow-2xl">
      
      <!-- Messages Area -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Suggested Questions Bar -->
      <div class="px-4 py-2.5 bg-slate-950/60 border-t border-slate-800/60">
        <div class="flex items-center gap-1.5 mb-2 text-[11px] font-semibold text-slate-400">
          <i class="fa-solid fa-lightbulb text-amber-400"></i>
          <span>Suggested Questions:</span>
        </div>
        <div class="overflow-x-auto whitespace-nowrap flex gap-2 pb-1 custom-scrollbar">
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="DHA aur Bahria Town me 1 Kanal plot ka kya rate chal raha hai?">
            <i class="fa-solid fa-map-location-dot text-emerald-400"></i>
            1 Kanal Plot Rates
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Property khareedne ke liye kon se documents zaroori hotay hain?">
            <i class="fa-solid fa-file-shield text-blue-400"></i>
            Required Documents (Fard / NOC)
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="5 Marla ghar ke liye kitni down payment deni hogi?">
            <i class="fa-solid fa-calculator text-purple-400"></i>
            5 Marla Down Payment
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Commercial plots ka rental yield aur ROI kaisa hai?">
            <i class="fa-solid fa-chart-line text-amber-400"></i>
            Commercial vs Residential ROI
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Installment plans par booking ka kya tareeqa hota hai?">
            <i class="fa-solid fa-money-check-dollar text-teal-400"></i>
            Installments & Booking
          </button>
          <button class="quick-prompt px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-emerald-500/20 hover:border-emerald-500/50 border border-slate-700/80 text-xs text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Fard aur Intiqal me kya farq hota hai?">
            <i class="fa-solid fa-stamp text-rose-400"></i>
            Fard vs Intiqal
          </button>
        </div>
      </div>

      <!-- Chat Input Bar -->
      <div class="p-3 sm:p-4 bg-slate-900/95 border-t border-slate-800/80">
        <form id="chat-form" class="flex items-center gap-2">
          <div class="relative flex-1">
            <input 
              type="text" 
              id="chat-input" 
              placeholder="Real estate ke baray mein koi bhi sawal puchein..."
              class="w-full bg-slate-950/90 border border-slate-700/90 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 shadow-inner"
              autocomplete="off"
            >
          </div>
          <button 
            type="submit" 
            id="btn-send"
            class="px-5 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-semibold text-sm shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2 shrink-0 cursor-pointer disabled:opacity-50"
          >
            <span>Send</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
        <div class="mt-2 flex items-center justify-between text-[11px] text-slate-500 px-1">
          <span>Roman Urdu, English, ya Urdu mein baat karein</span>
          <span>Press Enter to send</span>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
