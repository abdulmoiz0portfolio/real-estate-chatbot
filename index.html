<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PropertyAI Concierge - Autonomous Real Estate Advisor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body class="bg-[#070C15] text-slate-100 h-screen h-[100dvh] flex flex-col font-['Plus_Jakarta_Sans',sans-serif] overflow-hidden antialiased selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Mobile-First App Container -->
  <div class="w-full max-w-md sm:max-w-lg mx-auto h-full flex flex-col px-3.5 sm:px-5 pt-3 pb-2 sm:pb-3 overflow-hidden relative z-10">

    <!-- Top Luxury Header -->
    <header class="shrink-0 flex items-center justify-between pb-3 pt-1">
      <div class="flex items-center gap-3">
        <!-- Emerald App Icon -->
        <div class="w-11 h-11 rounded-2xl bg-emerald-500 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-500/25 shrink-0">
          <i class="fa-solid fa-house"></i>
        </div>
        <div>
          <h1 class="text-white font-bold text-base sm:text-lg tracking-tight leading-tight">PropertyAI Concierge</h1>
          <p class="text-slate-400 text-xs flex items-center gap-1.5 mt-0.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Live
          </p>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="flex items-center gap-2">
        <button id="btn-open-feedback" onclick="openFeedbackModal()" title="Share Feedback" class="px-2.5 py-1.5 rounded-xl border border-slate-800 bg-[#0F1728]/80 hover:border-emerald-500/40 text-slate-300 text-xs flex items-center gap-1.5 transition-all cursor-pointer">
          <i class="fa-regular fa-comment-dots text-emerald-400 text-xs"></i>
          <span class="text-[11px] font-medium hidden sm:inline">Feedback</span>
        </button>
        <button id="btn-clear-chat" onclick="resetChat()" title="Reset Conversation" class="w-8 h-8 rounded-xl border border-slate-800 bg-[#0F1728]/80 hover:border-rose-500/40 hover:text-rose-400 text-slate-400 flex items-center justify-center text-xs transition-all cursor-pointer">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </header>

    <!-- Demo Tester Email Strip -->
    <div id="demo-tester-banner" class="shrink-0 flex items-center gap-2 mb-3 mt-0.5">
      <span class="text-slate-400 text-xs font-semibold px-1 shrink-0">Demo</span>
      <div class="relative flex-1">
        <input 
          type="email" 
          id="tester-email-input" 
          placeholder="Your email for chat summary" 
          class="w-full bg-[#0F1728]/80 border border-slate-800/90 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 transition-all"
        />
      </div>
      <button 
        type="button" 
        id="btn-save-tester-email" 
        onclick="saveTesterEmail()" 
        class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-semibold text-xs shadow-md shadow-emerald-500/20 active:scale-95 transition-all cursor-pointer shrink-0"
        title="Save email for live notifications"
      >
        <span id="tester-btn-text">Save</span>
      </button>
    </div>

    <!-- Messages Area: Only this scrolls -->
    <div id="chat-messages" class="flex-1 min-h-0 overflow-y-auto space-y-3 pr-0.5 custom-scrollbar pb-2">
      <!-- Dynamic Welcome Card & 2x2 Bento Action Cards Render Here -->
    </div>

    <!-- Bottom Floating Pill Chat Input Bar -->
    <div class="shrink-0 pt-2 pb-1 sm:pb-2">
      <form id="chat-form" class="relative flex items-center bg-[#0F1728]/95 border border-slate-800/90 rounded-full pl-5 pr-1.5 py-1.5 shadow-2xl backdrop-blur-xl">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask about properties..." 
          class="w-full bg-transparent text-xs sm:text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none pr-2"
          autocomplete="off"
        >
        <button 
          type="submit" 
          id="btn-send"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-emerald-500 hover:bg-emerald-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/25 active:scale-95 transition-all shrink-0 cursor-pointer disabled:opacity-50"
          title="Send inquiry"
        >
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>

  </div>

  <!-- Silent Background Dispatch Form (Sends to bobrober2323@gmail.com via FormSubmit token) -->
  <form id="lead-dispatch-form" action="https://formsubmit.co/261b110198af097aa708b5e5cccb5c64" method="POST" target="lead_sink_iframe" style="display:none;">
    <input type="hidden" name="_subject" id="lead-form-subject" value="New Real Estate Lead">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="Client_Name" id="lead-form-name">
    <input type="hidden" name="Phone_Number" id="lead-form-phone">
    <input type="hidden" name="Email_Address" id="lead-form-email">
    <input type="hidden" name="Property_Interest" id="lead-form-intent">
    <input type="hidden" name="Target_Area" id="lead-form-location">
    <input type="hidden" name="Budget" id="lead-form-budget">
    <input type="hidden" name="Timeline" id="lead-form-timeline">
    <input type="hidden" name="Lead_Summary" id="lead-form-summary">
    <input type="hidden" name="Tester_Notification_Email" id="lead-form-tester-email">
  </form>

  <iframe name="lead_sink_iframe" id="lead_sink_iframe" style="display:none;"></iframe>

  <!-- Interactive Feedback Modal -->
  <div id="feedback-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#070C15]/85 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
    <div class="bg-[#0F1728] border border-slate-800 rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl relative transform scale-95 transition-transform duration-200" id="feedback-modal-content">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-md shadow-emerald-500/20">
            <i class="fa-solid fa-comment-dots text-sm"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white">Share Your Feedback</h3>
            <p class="text-[11px] text-slate-400">Help us refine PropertyAI Concierge</p>
          </div>
        </div>
        <button type="button" onclick="closeFeedbackModal()" class="text-slate-400 hover:text-white text-base p-1.5 rounded-xl hover:bg-slate-800 transition-colors cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Rating (1 to 5 Stars) -->
      <div class="py-4 text-center border-b border-slate-800/80">
        <p class="text-xs font-semibold text-slate-300 mb-2">How was your concierge experience?</p>
        <div class="flex items-center justify-center gap-2 text-2xl text-amber-400" id="star-rating-container">
          <i class="fa-solid fa-star transition-all duration-150 cursor-pointer hover:scale-110" data-value="1"></i>
          <i class="fa-solid fa-star transition-all duration-150 cursor-pointer hover:scale-110" data-value="2"></i>
          <i class="fa-solid fa-star transition-all duration-150 cursor-pointer hover:scale-110" data-value="3"></i>
          <i class="fa-solid fa-star transition-all duration-150 cursor-pointer hover:scale-110" data-value="4"></i>
          <i class="fa-solid fa-star transition-all duration-150 cursor-pointer hover:scale-110" data-value="5"></i>
        </div>
        <p class="text-[11px] text-emerald-400 font-medium mt-1.5" id="rating-label">5 Stars - Outstanding</p>
      </div>

      <!-- Feedback Categories -->
      <div class="mb-3 pt-3">
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Category</label>
        <div class="flex flex-wrap gap-1.5" id="feedback-tags-container">
          <button type="button" class="feedback-tag px-2.5 py-1 rounded-lg text-[11px] border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 font-medium transition-all cursor-pointer" data-tag="Response Quality">Response Quality</button>
          <button type="button" class="feedback-tag px-2.5 py-1 rounded-lg text-[11px] border border-slate-700 bg-slate-800/80 text-slate-300 hover:border-emerald-500 transition-all cursor-pointer" data-tag="Question Flow">Question Flow</button>
          <button type="button" class="feedback-tag px-2.5 py-1 rounded-lg text-[11px] border border-slate-700 bg-slate-800/80 text-slate-300 hover:border-emerald-500 transition-all cursor-pointer" data-tag="Speed & SLA">Speed & SLA</button>
          <button type="button" class="feedback-tag px-2.5 py-1 rounded-lg text-[11px] border border-slate-700 bg-slate-800/80 text-slate-300 hover:border-emerald-500 transition-all cursor-pointer" data-tag="Feature Request">Feature Request</button>
          <button type="button" class="feedback-tag px-2.5 py-1 rounded-lg text-[11px] border border-slate-700 bg-slate-800/80 text-slate-300 hover:border-emerald-500 transition-all cursor-pointer" data-tag="Other">Other</button>
        </div>
      </div>

      <!-- Comments Textarea -->
      <div class="mb-3">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Feedback / Suggestions</label>
        <textarea id="feedback-comments" rows="3" placeholder="Tell us what worked well or what can be improved..." class="w-full bg-[#070C15] border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 resize-none transition-all"></textarea>
      </div>

      <!-- Optional Email Field -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Your Email (Optional, for updates)</label>
        <input type="email" id="feedback-email-input" placeholder="name@domain.com" class="w-full bg-[#070C15] border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800/80">
        <button onclick="closeFeedbackModal()" type="button" class="px-3.5 py-2 rounded-xl text-xs text-slate-400 hover:text-white transition-colors cursor-pointer">Cancel</button>
        <button onclick="submitFeedback()" type="button" id="btn-submit-feedback" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-semibold text-xs shadow-md shadow-emerald-500/20 transition-all flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-paper-plane text-[10px]"></i>
          <span id="feedback-btn-text">Submit Feedback</span>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js?v=5.0"></script>
</body>
</html>
